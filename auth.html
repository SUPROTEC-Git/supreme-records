<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | Supreme Records</title>
    
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        :root {
            --bg-color: #06070d;
            --card-bg: rgba(15, 22, 36, 0.75);
            --neon-cyan: #00f3ff;
            --neon-purple: #b624ff;
            --text-main: #f0f2f5;
            --text-muted: #8f9cae;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #170d2e 0%, #06070d 70%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Переключатель вкладок */
        .tab-system {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(15, 22, 36, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            transition: all 0.3s;
        }

        .tab-btn.active {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        /* Окно формы */
        .auth-box {
            background: var(--card-bg);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
            padding: 40px 30px;
            border-left: 2px solid var(--neon-cyan);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--neon-purple);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(6, 7, 13, 0.85);
            border: 1px solid rgba(182, 36, 255, 0.2);
            border-radius: 4px;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--neon-purple);
        }
    </style>
</head>
<body>

    <div class="container" data-aos="zoom-in" data-aos-duration="600">
        
        <!-- Интерактивные вкладки управления -->
        <div class="tab-system">
            <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
            <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
        </div>

        <div class="auth-box">
            <!-- Панель 1: Авторизация -->
            <form id="login" class="form-panel active" action="https://formsubmit.co" method="POST">
                <input type="hidden" name="_subject" value="Попытка Входа на сайт рекордов!">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://github.io">
                
                <div class="form-group">
                    <label>Игровой Никнейм</label>
                    <input type="text" name="Логин_Ник" placeholder="Введи никнейм" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="Логин_Пароль" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Авторизоваться</button>
            </form>

            <!-- Панель 2: Регистрация -->
            <form id="register" class="form-panel" action="https://formsubmit.co" method="POST">
                <input type="hidden" name="_subject" value="Новая Регистрация аккаунта!">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://github.io">
                <div class="form-group">
                    <label>Придумайте Никнейм</label>
                    <input type="text" name="Рег_Ник" placeholder="Например: StickGod" required>
                </div>
                <div class="form-group">
                    <label>Ваш Email</label>
                    <input type="email" name="Рег_Почта" placeholder="player@mail.com" required>
                </div>
                <div class="form-group">
                    <label>Придумайте Пароль</label>
                    <input type="password" name="Рег_Пароль" placeholder="Минимум 6 символов" required>
                </div>
                <button type="submit" class="btn-submit">Создать профиль</button>
            </form>

            <a href="index.html" class="back-link">Вернуться на главную</a>
        </div>
    </div>

    <script src="https://unpkg.com"></script>
    <script>
        AOS.init({ once: true });

        // Логика быстрого переключения вкладок без перезагрузки страницы
        function switchTab(tabId) {
            document.querySelectorAll('.form-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
