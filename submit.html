<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подать рекорд | Supreme Records</title>
    
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        :root {
            --bg-color: #06070d;
            --card-bg: rgba(15, 22, 36, 0.75);
            --neon-cyan: #00f3ff;
            --neon-purple: #b624ff;
            --text-main: #f0f2f5;
            --text-muted: #8f9cae;
        }

        body {
            background: radial-gradient(circle at 50% 0%, #170d2e 0%, #06070d 70%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 50px 20px 20px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(135deg, #fff 30%, var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
            filter: drop-shadow(0 2px 10px rgba(182, 36, 255, 0.3));
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* МОДЕРНОВАЯ ФОРМА С КИБЕРПАНК УГЛАМИ */
        .form-box {
            background: var(--card-bg);
            clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 25px 100%, 0 calc(100% - 25px));
            padding: 40px;
            border-left: 2px solid var(--neon-purple);
            border-right: 2px solid var(--neon-purple);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            position: relative;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* Хай-тек поля ввода */
        input, select {
            width: 100%;
            padding: 14px 18px;
            background-color: rgba(6, 7, 13, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 4px;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(182, 36, 255, 0.3);
            background-color: rgba(6, 7, 13, 0.95);
        }

        /* Полное скрытие стрелок */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        select option {
            background: #06070d;
            color: #fff;
        }

        .btn-block {
            display: flex;
            gap: 20px;
            margin-top: 35px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-send {
            color: #fff;
            background: transparent;
            border: 1px solid var(--neon-purple);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .btn-send:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 20px rgba(182, 36, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn-back {
            color: var(--text-muted);
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .btn-back:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <h1 data-aos="zoom-in" data-aos-duration="800">Submit Record</h1>
    </header>

    <div class="container" data-aos="fade-up" data-aos-duration="800" data-aos-delay="150">
        <form action="https://formsubmit.co/titansmsvm5@gmail.com" method="POST" class="form-box">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="Новый рекорд Supreme Duelist!">
            <input type="hidden" name="_next" value="https://github.io">

            <div class="form-group">
                <label for="nickname">Игровой никнейм</label>
                <input type="text" id="nickname" name="Игрок" placeholder="Введите ваш ник" required>
            </div>

            <div class="form-group">
                <label for="weapon">Используемое оружие</label>
                <select id="weapon" name="Оружие" required>
                    <option value="" disabled selected>Выберите оружие...</option>
                    <option value="Меч Бога Грома">Меч Бога Грома</option>
                    <option value="Энергетический Щит">Энергетический Щит</option>
                    <option value="Огненные Когти">Огненные Когти</option>
                    <option value="Посох Иллюзиониста">Посох Иллюзиониста</option>
                    <option value="Световой Меч">Световой Меч</option>
                </select>
            </div>

            <div class="form-group">
                <label for="score">Очки выживания</label>
                <!-- Стрелочки скрыты, текст изменен на очки -->
                <input type="number" id="score" name="Очки" placeholder="Например: 1250000" min="1" required>
            </div>

            <div class="form-group">
                <label for="proof">Доказательство (YouTube / Ссылка на скриншот)</label>
                <input type="url" id="proof" name="Пруф" placeholder="https://youtube.com..." required>
            </div>

            <div class="btn-block">
                <a href="index.html" class="btn btn-back">Назад</a>
                <button type="submit" class="btn btn-send">Отправить</button>
            </div>
        </form>
    </div>

    <script src="https://unpkg.com"></script>
    <script>
        AOS.init({ once: true });
    </script>
</body>
</html>
